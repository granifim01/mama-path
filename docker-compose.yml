services:
  postgres:
    image: postgres:16-alpine
    container_name: mama-path-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mamapath
      POSTGRES_PASSWORD: mamapath
      POSTGRES_DB: mamapath
    ports:
      - "5432:5432"
    volumes:
      - mama_path_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamapath -d mamapath"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mama_path_pgdata:
